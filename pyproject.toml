[project]
name = "rag-test"
version = "0.1.0"
description = "A beginner-friendly PDF RAG example"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "langchain-core>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
  "opensearch-py>=2.7",
  "openai>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
